<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Record Retrieval</title>
    <style>
      :root {
        color-scheme: light;
        font: 16px/1.5 system-ui, sans-serif;
        color: #17212b;
        background: #f3f6f8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 16px; }
      main { max-width: 960px; margin: 0 auto; }
      .panel {
        background: white;
        border: 1px solid #dce3e8;
        border-radius: 12px;
        margin-bottom: 20px;
        padding: 24px;
      }
      h1 { font-size: 1.6rem; margin: 0 0 6px; }
      h2 { font-size: 1.2rem; margin: 0 0 16px; }
      p { color: #52616d; margin: 0 0 20px; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      form { max-width: 440px; }
      input, button {
        box-sizing: border-box;
        font: inherit;
        padding: 10px 12px;
        width: 100%;
      }
      input { border: 1px solid #aebbc5; border-radius: 6px; margin-bottom: 14px; }
      button {
        background: #126b57;
        border: 0;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled { cursor: wait; opacity: 0.65; }
      #message { margin: 14px 0 0; overflow-wrap: anywhere; }
      #message.error { color: #a32929; }
      [hidden] { display: none !important; }
      .info-grid, .summary-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      .info-item, .summary-item {
        background: #f3f6f8;
        border-radius: 8px;
        padding: 12px 14px;
        overflow-wrap: anywhere;
      }
      .info-item span, .summary-item span {
        color: #52616d;
        display: block;
        font-size: 0.9rem;
      }
      .info-item strong, .summary-item strong { display: block; }
      .timeline-event {
        border-left: 3px solid #126b57;
        margin: 0 0 20px 8px;
        padding: 0 0 4px 18px;
      }
      .timeline-event time { color: #126b57; font-weight: 650; }
      .timeline-event h3 { font-size: 1rem; margin: 4px 0; }
      .timeline-event p { margin: 4px 0 8px; }
      .sources, .notice { color: #52616d; font-size: 0.9rem; }
      .empty-timeline { color: #52616d; }
      @media (max-width: 600px) {
        body { padding: 18px 10px; }
        .panel { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="page-title">
        <h1 id="page-title">Patient record retrieval</h1>
        <p>Enter a patient ID to retrieve synthetic records from all hospitals.</p>
        <form id="request-form">
          <label for="patient-id">Patient ID</label>
          <input id="patient-id" name="patient_id" placeholder="SYN-0001" required
                 pattern="SYN-[0-9]{4}" autocomplete="off">
          <button id="submit-button" type="submit">Retrieve and summarize</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
      </section>

      <section id="patient-info" class="panel" aria-labelledby="patient-info-title" hidden>
        <h2 id="patient-info-title">Patient overview</h2>
        <div class="info-grid">
          <div class="info-item"><span>Patient ID</span><strong id="patient-value"></strong></div>
          <div class="info-item"><span>Request ID</span><strong id="request-value"></strong></div>
          <div class="info-item"><span>Retrieval status</span><strong id="status-value"></strong></div>
          <div class="info-item"><span>Synthetic data</span><strong id="synthetic-value"></strong></div>
          <div class="info-item"><span>Hospitals searched</span><strong id="searched-value"></strong></div>
          <div class="info-item"><span>Hospitals with records</span><strong id="hospital-count-value"></strong></div>
        </div>
      </section>

      <section id="retrieval-summary" class="panel" aria-labelledby="summary-title" hidden>
        <h2 id="summary-title">Record coverage</h2>
        <div id="summary-grid" class="summary-grid"></div>
        <h2>Chronological summary</h2>
        <p id="summary-notice" class="notice"></p>
        <div id="timeline" aria-live="polite"></div>
      </section>
    </main>
    <script>
      const form = document.querySelector("#request-form");
      const button = document.querySelector("#submit-button");
      const message = document.querySelector("#message");
      const patientInfo = document.querySelector("#patient-info");
      const summaryPanel = document.querySelector("#retrieval-summary");
      const summaryGrid = document.querySelector("#summary-grid");
      const summaryNotice = document.querySelector("#summary-notice");
      const timelineContainer = document.querySelector("#timeline");
      const categoryLabels = {
        visits: "Visits",
        diagnoses: "Diagnoses",
        medications: "Medications",
        lab_results: "Laboratory results",
        procedures: "Procedures",
        clinical_notes: "Clinical notes",
        allergies: "Allergies",
        vital_signs: "Vital signs"
      };
      const categoryNames = Object.keys(categoryLabels);

      function setText(id, value) {
        document.querySelector(`#${id}`).textContent =
          value === null || value === undefined || value === "" ? "—" : String(value);
      }

      function showRequestInfo(data) {
        setText("patient-value", data.patient_id);
        setText("request-value", data.request_id);
        setText("status-value", data.status);
        setText("synthetic-value", data.synthetic === true ? "Yes" : "No");
        setText("searched-value", data.hospitals_searched);
        setText("hospital-count-value", data.hospital_count);
        patientInfo.hidden = false;
      }

      function showResults(data) {
        showRequestInfo(data);
        summaryGrid.replaceChildren();
        for (const category of categoryNames) {
          const item = document.createElement("div");
          item.className = "summary-item";
          const label = document.createElement("span");
          label.textContent = `Total ${categoryLabels[category].toLowerCase()}`;
          const count = document.createElement("strong");
          count.textContent = String(data.record_summary[category] ?? 0);
          item.append(label, count);
          summaryGrid.appendChild(item);
        }
        summaryNotice.textContent = data.summary_notice || "";
        timelineContainer.replaceChildren();
        if (data.timeline.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-timeline";
          empty.textContent = "No records were available to summarize.";
          timelineContainer.appendChild(empty);
        }
        for (const event of data.timeline) {
          const entry = document.createElement("article");
          entry.className = "timeline-event";
          const date = document.createElement("time");
          date.dateTime = event.date;
          date.textContent = event.date;
          const title = document.createElement("h3");
          title.textContent = event.title;
          const summary = document.createElement("p");
          summary.textContent = event.summary;
          const sources = document.createElement("p");
          sources.className = "sources";
          sources.textContent = `Sources: ${event.sources
            .map((source) => `${source.hospital} — ${source.category} (${source.id})`)
            .join("; ")}`;
          entry.append(date, title, summary, sources);
          timelineContainer.appendChild(entry);
        }
        summaryPanel.hidden = false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "Retrieving records and checking a summary with local Ollama…";
        message.classList.remove("error");
        button.disabled = true;
        patientInfo.hidden = true;
        summaryPanel.hidden = true;

        try {
          const response = await fetch("/api/requests", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              patient_id: form.elements.patient_id.value
            })
          });
          const data = await response.json();
          if (data.request_id) {
            showRequestInfo(data);
          }
          if (!response.ok) {
            throw new Error(data.error || "Could not retrieve patient records");
          }
          if (
            !Array.isArray(data.timeline) ||
            !data.record_summary ||
            typeof data.record_summary !== "object" ||
            Array.isArray(data.record_summary) ||
            data.timeline.some((item) =>
              !item ||
              typeof item.date !== "string" ||
              typeof item.title !== "string" ||
              typeof item.summary !== "string" ||
              !Array.isArray(item.sources) ||
              item.sources.some((source) =>
                !source ||
                typeof source.id !== "string" ||
                typeof source.category !== "string" ||
                typeof source.hospital !== "string"
              )
            )
          ) {
            throw new Error(
              "The API response is missing the summary. Restart the backend using the latest project code, then try again."
            );
          }

          showResults(data);
          const total = Object.values(data.record_summary)
            .reduce((sum, count) => sum + count, 0);
          message.textContent = `Retrieved ${total} record(s) across all categories.`;
          form.reset();
        } catch (error) {
          message.textContent = error.message || "Could not reach the server.";
          message.classList.add("error");
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
